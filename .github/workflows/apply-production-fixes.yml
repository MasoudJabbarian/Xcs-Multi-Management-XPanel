name: Apply validated production fixes

on:
  push:
    branches:
      - ubuntu-24-support

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          chmod +x "Web Panel/app/install-fixes.sh"
          "Web Panel/app/install-fixes.sh" "$GITHUB_WORKSPACE/Web Panel/app"

      - name: Verify source
        run: |
          test -f "Web Panel/app/public/index.php"
          test -f "Web Panel/app/public/.htaccess"
          test -d "Web Panel/app/public/assets"
          php -l "Web Panel/app/app/Http/Controllers/UserController.php"
          php -l "Web Panel/app/app/Http/Controllers/ApiController.php"
          php -l "Web Panel/app/app/Http/Controllers/PackagesController.php"
          php -l "Web Panel/app/routes/web.php"

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/apply-production-fixes.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: sync validated production changes [auto-fix]"
          git push
